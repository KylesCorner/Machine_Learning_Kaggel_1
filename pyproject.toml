[project]
name = "mushroom-model"
version = "0.1.0"
description = "Model for the Kaggle Playground Series S4E8 mushroom classification competition"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "catboost>=1.2.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.scripts]
mushroom-train = "mushroom_model.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mushroom_model"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
